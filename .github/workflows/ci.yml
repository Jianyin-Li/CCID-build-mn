name: build-ccid

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Debian source version, e.g. 1.8.4-1"
        required: true
        default: "1.8.4-1"

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
          - platform: linux/arm/v7
            arch: armhf
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Build ${{ matrix.arch }}
        env:
          V: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm --platform ${{ matrix.platform }} \
            -e V="$V" -e ARCH="${{ matrix.arch }}" \
            -v "$PWD/out:/out" \
            debian:trixie bash -euxo pipefail -c '
              printf "%s\n" \
                "Types: deb deb-src" \
                "URIs: http://deb.debian.org/debian" \
                "Suites: trixie" \
                "Components: main" \
                > /etc/apt/sources.list.d/debian.sources
              rm -f /etc/apt/sources.list

              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential dpkg-dev debhelper meson ninja-build \
                ca-certificates curl

              mkdir -p /work && cd /work

              base=http://deb.debian.org/debian/pool/main/c/ccid
              up=${V%-*}
              newv="${V}~spark1"

              for f in "ccid_${V}.dsc" \
                       "ccid_${up}.orig.tar.xz" \
                       "ccid_${up}.orig.tar.xz.asc" \
                       "ccid_${V}.debian.tar.xz"; do
                echo "==> fetching ${base}/${f}"
                curl -fsSLO "${base}/${f}" || { echo "download failed: ${f}"; exit 1; }
              done

              dpkg-source -x "ccid_${V}.dsc"
              cd "ccid-${up}"

              # 手工插入 changelog，版本号完全可控（不用 dch --local，它会追加计数器）
              {
                printf "ccid (%s) trixie; urgency=medium\n\n" "$newv"
                printf "  * Rebuild for Spark ORG trixie (debhelper compat lowered to 13).\n"
                printf "  * libccid 1.8.4 adds PicoKey / Pico OpenPGP / Pico HSM CCID support.\n\n"
                printf " -- Spark ORG <repo@sparkorg.org>  %s\n\n" "$(LC_ALL=C date -R)"
                cat debian/changelog
              } > /tmp/changelog.new
              mv /tmp/changelog.new debian/changelog
              head -8 debian/changelog

              sed -i -E "s/debhelper-compat \(= 1[0-9]\)/debhelper-compat (= 13)/" debian/control
              grep -n "debhelper-compat" debian/control

              apt-get build-dep -y .
              dpkg-checkbuilddepcommands 2>/dev/null || dpkg-checkbuilddeps
              echo "build-deps OK"

              dpkg-buildpackage -us -uc -sa

              echo "=== generated files ==="
              ls -l ..

              cp "../libccid_${newv}_${ARCH}.deb" /out/
              if [ "$ARCH" = amd64 ]; then
                cp "../ccid_${newv}.dsc" \
                   "../ccid_${up}.orig.tar.xz" \
                   "../ccid_${up}.orig.tar.xz.asc" \
                   "../ccid_${newv}.debian.tar.xz" \
                   "../ccid_${newv}_${ARCH}.buildinfo" /out/
              fi

              echo "=== /out ==="
              ls -l /out
            '

      - name: Sanity check
        run: |
          set -euo pipefail
          ls -l out
          for f in out/*.deb; do
            echo "--- $f"
            dpkg-deb -f "$f" Package Version Architecture Depends
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ccid-${{ matrix.arch }}
          path: out/*
          retention-days: 7

  release:
    name: pack tar and release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Pack tar
        run: |
          set -euo pipefail
          ls -l dist
          TAR="ccid_${{ inputs.version }}~spark1.tar"
          tar -cf "$TAR" -C dist .
          tar -tvf "$TAR"
          ls -l "$TAR"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ccid-${{ inputs.version }}-spark1
          TAR: ccid_${{ inputs.version }}~spark1.tar
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$TAR" \
            --repo "${{ github.repository }}" \
            --title "libccid ${VER}~spark1 (trixie)" \
            --notes "Rebuilt from Debian ${VER} for Spark ORG trixie (debhelper compat lowered to 13). amd64 / arm64 / armhf. Includes PicoKey (Pico OpenPGP / HSM / FIDO) CCID support from libccid 1.8.x." \
          || gh release upload "$TAG" "$TAR" --clobber --repo "${{ github.repository }}"
